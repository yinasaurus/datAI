# Local PostgreSQL 16 so Role 2 can run a question before the Olist load exists.
# Role 1 replaces db/init/01_sample.sql with the real schema and data.
# The password is a local sample only. Do not reuse it anywhere else.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: olist
      POSTGRES_PASSWORD: olist
      POSTGRES_DB: olist
    ports:
      - "5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
