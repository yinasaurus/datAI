# Local PostgreSQL 16 for the Olist marketplace database.
# db/init/01_schema.sql creates the tables on first start; db/load_olist.py loads the data.
# The password is a local sample only. Do not reuse it anywhere else.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: olist
      POSTGRES_PASSWORD: olist
      POSTGRES_DB: olist
    ports:
      - "5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
